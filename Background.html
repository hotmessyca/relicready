* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #101010;
  --panel: #1a1a1a;
  --border: #333;
  --text: #f5f0e7;
  --muted: #999;
  --gold: #d8a84e;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

header {
  border-bottom: 1px solid var(--border);
  padding: 18px 20px;
  position: sticky;
  top: 0;
  background: rgba(16,16,16,.96);
  z-index: 10;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: 800;
}

.logo span {
  color: var(--gold);
}

.beta {
  color: var(--gold);
  border: 1px solid #665027;
  border-radius: 20px;
  padding: 6px 10px;
  font-size: 10px;
  font-weight: bold;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 28px 18px 60px;
}

.back {
  display: inline-block;
  color: var(--gold);
  text-decoration: none;
  margin-bottom: 20px;
  font-size: 13px;
}

.hero {
  margin-bottom: 22px;
}

  font-size: clamp(28px, 6vw, 44px);
  margin-bottom: 8px;
}
